spring:
  application:
    name: estratego-backend

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-sparkling-union-ax3dd9pr-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&currentSchema=public}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 240000
      idle-timeout: 120000
      keepalive-time: 60000
      connection-timeout: 30000

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

jwt:
  secret: ${JWT_SECRET:clave-de-desarrollo-local-estratego-con-mas-de-32-bytes-2026-segura}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  mail:
    # Apagado por defecto: sin SMTP configurado la carga masiva funciona igual, solo no envía correos
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  # Zona para interpretar fechas con "Z" o desfase que envía el front
  zona-horaria: ${APP_ZONA_HORARIA:America/Bogota}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000}

logging:
  level:
    root: INFO
    com.estratego: DEBUG