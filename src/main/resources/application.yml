spring:
  application:
    name: estratego-backend

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-sparkling-union-ax3dd9pr-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&currentSchema=public}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 240000
      idle-timeout: 120000
      keepalive-time: 60000
      connection-timeout: 30000

  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

jwt:
  secret: ${JWT_SECRET:clave-de-desarrollo-local-estratego-con-mas-de-32-bytes-2026-segura}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000}

logging:
  level:
    root: INFO
    com.estratego: DEBUG