# Perfil "dev": solo sobrescribe lo necesario para depurar en local.
# Todo lo demás (PostgreSQL/Neon, JWT, correo, CORS, zona horaria) se hereda de application.yml.
# Uso: mvn spring-boot:run "-Dspring-boot.run.profiles=dev"

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.estratego: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
